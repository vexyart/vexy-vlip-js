# this_file: .github/workflows/publish.yml
# Trigger: publish a GitHub Release from the git tag (e.g. v1.0.6) and this
# workflow ships that version to npm. The version in package.json is advisory —
# the tag is the source of truth, so the job stamps it in before publishing.
#
# Setup needed once per repo (pick one):
#   - Trusted publishing (recommended): configure npm's OIDC trusted publisher
#     for `vexy-vlip-js` pointing at this workflow. `id-token: write` below is
#     what npm's provenance/OIDC handshake uses; no token secret required.
#   - Token fallback: add an `NPM_TOKEN` repo secret (an npm automation token)
#     and it is read via NODE_AUTH_TOKEN in the publish step.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Stamp package.json version from tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit tests
        run: npm run test:unit

      - name: Build bundles
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
