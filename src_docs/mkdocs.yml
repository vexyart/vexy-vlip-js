# this_file: src_docs/mkdocs.yml
site_name: vexy-vlip-js
site_description: Interactive explainer video player that turns one video and a WebVTT file into styled, positioned, click-to-advance on-screen cards.
site_url: https://vexy.dev/vexy-vlip-js/
repo_url: https://github.com/vexyart/vexy-vlip-js
repo_name: vexyart/vexy-vlip-js
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Authoring cards: cue-format.md
  - Options and attributes: options.md
  - API reference: api.md
  - Theming: theming.md
  - How playback works: architecture.md
  - Live demos: demos.md
  - Development: development.md
